<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HomeWard - Home Care Monitor</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header class="topbar">
  <div class="brand">
    <span class="logo">✚</span>
    <div>
      <h1>HomeWard</h1>
      <small>Sense → Understand → Predict → Alert → Respond</small>
    </div>
  </div>
  <div class="top-right">
    <label class="me">Signed in as
      <input id="me" value="Priya (caregiver)" maxlength="80">
    </label>
    <span id="conn" class="pill pill-wait">connecting…</span>
    <button id="toggleDemo" class="btn ghost">Demo controls</button>
  </div>
</header>

<section id="demo" class="demo hidden">
  <strong>Simulator controls</strong>
  <span class="hint">Change what the virtual sensors report. Used for demos only.</span>
  <div id="demoPatients" class="demo-row"></div>
  <div class="demo-row">
    <button class="btn warn" id="outageBtn">Simulate 20s network outage</button>
    <button class="btn" id="o2Btn">Unplug / replug P003 oxygen concentrator</button>
  </div>
</section>

<main class="layout">
  <aside class="patients">
    <h2>Patients</h2>
    <div id="patientList"></div>
  </aside>

  <section class="detail" id="detail">
    <div class="empty">Select a patient</div>
  </section>

  <aside class="side">
    <h2>Active alerts <span id="alertCount" class="count">0</span></h2>
    <div id="alerts"></div>
    <h2>Activity &amp; audit trail</h2>
    <div id="events" class="events"></div>
  </aside>
</main>

<template id="detailTpl">
  <div class="phead">
    <div>
      <h2 class="pname"></h2>
      <div class="pmeta"></div>
      <div class="pcontacts"></div>
    </div>
    <div class="pactions">
      <div class="device"></div>
      <button class="btn primary checkin">✓ Caregiver check-in</button>
      <div class="lastcheckin"></div>
    </div>
  </div>

  <div class="grid2">
    <div class="card risk">
      <div class="risk-head">
        <div>
          <div class="label">AI risk assessment</div>
          <div class="risk-level"></div>
        </div>
        <div class="news2box"><div class="label">NEWS2</div><div class="news2"></div></div>
      </div>
      <div class="ew"></div>
      <div class="label">Why</div>
      <ul class="reasons"></ul>
      <div class="action"></div>
      <div class="disclaimer"></div>
    </div>

    <div class="card predict">
      <div class="label">Prediction (next 48h, damped trend projection)</div>
      <div class="pred-main"></div>
      <div class="pred-timeline"></div>
      <ul class="trends"></ul>
      <div class="label">NEWS2 breakdown (current)</div>
      <table class="breakdown"><tbody></tbody></table>
    </div>
  </div>

  <div class="vitals"></div>

  <div class="card">
    <div class="label">Vital-sign trends <span class="hint">(patient time; shaded = normal range, ◆ = back-filled after outage)</span></div>
    <div class="charts"></div>
  </div>

  <div class="grid2">
    <div class="card notes">
      <div class="label">Caregiver notes <span class="hint">(analysed for symptoms; English + basic Hindi/Telugu)</span></div>
      <form class="noteform">
        <textarea maxlength="2000" placeholder="e.g. Seems confused this evening and refused dinner. No chest pain."></textarea>
        <div class="samples"></div>
        <button class="btn primary" type="submit">Add note</button>
      </form>
      <div class="notelist"></div>
    </div>
    <div class="card">
      <div class="label">Alert history</div>
      <div class="alerthistory"></div>
      <div class="label">Check-ins (attendance)</div>
      <div class="checkins"></div>
    </div>
  </div>
</template>

<script src="/static/app.js"></script>
</body>
</html>
